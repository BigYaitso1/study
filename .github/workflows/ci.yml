
name: Airflow CI

on:
  push:
    branches:
      - main
      - setup-environments

  pull_request:
    branches:
      - main

jobs:
  check-dag:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: python -m compileall -q dags
